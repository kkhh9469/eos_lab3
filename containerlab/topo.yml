name: eos_lab_3

topology:
  nodes:
    # network device
    isp1:
      kind: arista_ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.10

    edge1:
      kind: arista_ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.20

    core1:
      kind: arista_ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.30

    core2:
      kind: arista_ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.40

    access1:
      kind: arista_ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.50

    access2:
      kind: arista_ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.60

    # endpoint device
    server:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.130.2/24 dev eth1
        - ip route del default
        - ip route add default via 192.168.130.1 dev eth1

    pc1:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.110.2/24 dev eth1
        - ip route del default
        - ip route add default via 192.168.110.1 dev eth1

    pc2:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.110.3/24 dev eth1
        - ip route del default
        - ip route add default via 192.168.110.1 dev eth1

    ap1:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.120.2/24 dev eth1
        - ip route del default
        - ip route add default via 192.168.120.1 dev eth1

    ap2:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.120.3/24 dev eth1
        - ip route del default
        - ip route add default via 192.168.120.1 dev eth1

  links:
    # isp
    - endpoints: ['isp1:eth1', 'edge1:eth1']
    # edge
    - endpoints: ['edge1:eth2', 'core1:eth1']
    - endpoints: ['edge1:eth3', 'core2:eth1']
    # core
    - endpoints: ['core1:eth2', 'core2:eth2']
    - endpoints: ['core1:eth3', 'core2:eth3']
    - endpoints: ['core1:eth4', 'access1:eth1']
    - endpoints: ['core1:eth5', 'access1:eth2']
    - endpoints: ['core2:eth4', 'access2:eth1']
    - endpoints: ['core2:eth5', 'access2:eth2']
    # access
    - endpoints: ['access1:eth3', 'pc1:eth1']
    - endpoints: ['access1:eth4', 'ap1:eth1']
    - endpoints: ['access2:eth3', 'pc2:eth1']
    - endpoints: ['access2:eth4', 'ap2:eth1']
    - endpoints: ['access2:eth5', 'server:eth1']